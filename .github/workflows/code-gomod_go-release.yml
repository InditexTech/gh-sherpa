name: code-gomod-go-release
run-name: Create Go GitHub release from ${{ github.event_name }}

on:
  pull_request:
    types: [closed]
    branches: [main, main-*]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type to use
        required: true
        default: release-type/minor
        type: choice
        options:
          - release-type/hotfix
          - release-type/multi-hotfix
          - release-type/major
          - release-type/minor
          - release-type/patch

permissions:
  contents: read

concurrency:
  group: code-gomod-go-release-${{ github.repository }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-core:
    name: Prepare and Build Release
    uses: ./.github/workflows/code-gomod_go-release-core.yml
    with:
      release_type: ${{ inputs.release_type }}
    secrets: inherit

  github-release:
    name: Create GitHub Release ${{ matrix.release.tag }}
    needs: release-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-core.outputs.releases) }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Download release distributions
        # Binaries are opt-in; a project that declares artifacts: none cuts a tag-only release.
        if: needs.release-core.outputs.artifacts == 'binaries'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-distributions-${{ matrix.release.tag }}
          path: dist

      - name: Create or update GitHub Release
        # release-core already created and pushed the annotated vX.Y.Z tag; this
        # publishes its GitHub Release with generated notes, attaching dist/* only
        # when the project opted into binaries. --clobber keeps re-runs idempotent.
        env:
          ARTIFACTS: ${{ needs.release-core.outputs.artifacts }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ matrix.release.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          if [[ "$ARTIFACTS" == "binaries" ]]; then
            assets=(dist/*)
            if [[ ${#assets[@]} -eq 0 ]]; then
              echo "::error title=Missing distributions::artifacts: binaries produced an empty release artifact."
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [[ ${#assets[@]} -gt 0 ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
