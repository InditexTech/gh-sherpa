name: code-release-preview

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review, opened, reopened]
    branches: [main, main-*, develop, develop-*]

permissions:
  contents: read

concurrency:
  group: code-release-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}

jobs:
  release-preview:
    name: Release Preview
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (vars.DEVELOPMENT_FLOW == 'trunk-based-development' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-'))) ||
        (vars.DEVELOPMENT_FLOW == 'git-flow' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve pull request merge commit
        id: merge-commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/pull/${GITHUB_EVENT_NUMBER}/merge" ]] \
            || [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$MERGE_SHA" == "$HEAD_SHA" ]]; then
            echo "::error title=No merge commit::GitHub provides no merge commit of this pull request with its base, so no release can be proposed."
            body=$'### Release Preview\n\nGitHub provides no merge commit of this pull request with its base (for example, it conflicts with its base), so no release is proposed. Resolve the conflict to get a preview.'
            gh pr comment "$GITHUB_EVENT_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
            exit 1
          fi
          echo "merge_commit=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.merge-commit.outputs.merge_commit }}

      - name: Check CHANGELOG has Unreleased changes
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'skip-release') &&
          github.event.pull_request.head.ref != 'automated/ci-governance-sync' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "origin/$BASE_REF"...HEAD -- CHANGELOG.md; then
            echo "::error title=No CHANGELOG changes::Update the Unreleased section with this release's changes."
            gh pr comment "$GITHUB_EVENT_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'### :x: No changes in `CHANGELOG.md`\nUpdate the `## [Unreleased]` section listing the changes for this release before merging.'
            exit 1
          fi

      - name: Resolve release type
        id: release-type
        env:
          DEVELOPMENT_FLOW: ${{ vars.DEVELOPMENT_FLOW }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ",$RELEASE_LABELS," == *",skip-release,"* ]]; then
            body=$'### Release Preview\n\nThis pull request has the `skip-release` label and will not create a GitHub release.'
            gh pr comment "$GITHUB_EVENT_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
            exit 0
          fi

          case ",$RELEASE_LABELS," in
            *",release-type/major,"*) release_bump="major" ;;
            *",release-type/minor,"*) release_bump="minor" ;;
            *",release-type/hotfix,"*|*",release-type/multi-hotfix,"*|*",release-type/patch,"*)
              release_bump="patch"
              ;;
            *)
              if [[ "$DEVELOPMENT_FLOW" == "trunk-based-development" ]]; then
                release_bump="minor"
              else
                body=$'### Release Preview\n\nAdd a `release-type/...` label to calculate a release for this git-flow pull request.'
                gh pr comment "$GITHUB_EVENT_NUMBER" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body "$body"
                exit 0
              fi
              ;;
          esac

          echo "release_bump=$release_bump" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: release-version
        if: steps.release-type.outputs.release_bump != ''
        uses: InditexTech/gh-actions/release-version@ab7978dfa118776238a6982e445707a1ae6c0668 # v1.2.0
        with:
          release-type: ${{ steps.release-type.outputs.release_bump }}
          tag-format: v
          strategy: single
          packages: '[{"name": "module", "tag-prefix": "", "declared-version": ""}]'

      - name: Check legacy bare release tags
        if: steps.release-type.outputs.release_bump != ''
        env:
          RELEASES: ${{ steps.release-version.outputs.releases }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          strict='^[0-9]+\.[0-9]+\.[0-9]+$'
          base="$(jq -er '.[0].base' <<< "$RELEASES")"
          base_label="v$base"
          if [[ -z "$base" ]]; then
            base="0.0.0"
            base_label="none"
          fi
          if [[ ! "$base" =~ $strict ]]; then
            echo "::error title=Invalid release base::The computed release base '$base' is not X.Y.Z."
            exit 1
          fi

          bare_tags="$(git tag --list --merged HEAD '[0-9]*')"
          highest="$(printf '%s\n' "$bare_tags" | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          if [[ -z "$highest" ]]; then
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "$highest" "$base" | sort -s -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          if [[ "$highest" != "$base" && "$newest" == "$highest" ]]; then
            echo "::error title=Legacy bare release tag::Release tag $highest is higher than the latest v release tag ($base_label). Create the compatibility tag v$highest on the same commit as $highest, then release again."
            exit 1
          fi

      - name: Calculate release preview
        if: steps.release-type.outputs.release_bump != ''
        env:
          DEVELOPMENT_FLOW: ${{ vars.DEVELOPMENT_FLOW }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ steps.release-type.outputs.release_bump }}
          RELEASES: ${{ steps.release-version.outputs.releases }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          release_bump="$RELEASE_BUMP"
          merge_strategy="Create a merge commit"
          if [[ "$DEVELOPMENT_FLOW" == "trunk-based-development" ]]; then
            merge_strategy="Squash and merge"
          fi

          current_version="$(jq -er '.[0].base' <<< "$RELEASES")"
          release_tag="$(jq -er '.[0].tag' <<< "$RELEASES")"

          if [[ -n "$current_version" ]]; then
            current_label="\`v$current_version\`"
          else
            current_label="_none (first release)_"
          fi
          versions="$(printf '%s\n' \
            "- Current version (latest tag): $current_label" \
            "- Proposed release tag: \`$release_tag\`" \
            "- Next development version: CHANGELOG \`## [Unreleased]\` re-seeded on the release commit (tag-only, no in-tree version)")"

          changes="$(awk '
            BEGIN { capture=0 }
            /^## \[[Uu]nreleased\]/ { capture=1; next }
            capture && /^## \[/ { capture=0 }
            capture { print }
          ' CHANGELOG.md)"

          body="$(printf "%s\n\n%s\n- Release type: \`%s\`\n- Expected merge strategy: **%s**\n\n#### Changes\n%s" \
            '### Go Release Preview' \
            "$versions" \
            "$release_bump" \
            "$merge_strategy" \
            "$changes")"
          gh pr comment "$GITHUB_EVENT_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"
